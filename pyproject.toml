[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "field-report-builder"
version = "0.1.0"
description = "Windows desktop tool that turns site photos and voice memos into an inspector's daily work report"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "faster-whisper>=1.0",
    "av>=11,<19",
    "reportlab>=4.0",
    "python-docx>=1.1",
    "Pillow>=10.1",
    "pillow-heif>=0.16",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pypdf>=4.0", "pyinstaller>=6.6"]

[project.scripts]
field-report-builder = "field_report_builder.ui.main_window:main"

[tool.setuptools.packages.find]
include = ["field_report_builder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
